[project]
name = "ingestion-storage-orchestration"
version = "0.1.0"
description = "Ingestion and storage orchestration service for the Enterprise RAG platform"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "pytest>=8.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
