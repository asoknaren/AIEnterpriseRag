[project]
name = "streamlit-ui-rag"
version = "0.1.0"
description = "Streamlit UI and RAG experience for the Enterprise RAG platform"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.35",
  "pytest>=8.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
