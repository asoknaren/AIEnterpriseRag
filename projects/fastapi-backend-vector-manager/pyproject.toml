[project]
name = "fastapi-backend-vector-manager"
version = "0.1.0"
description = "FastAPI backend vector manager for the Enterprise RAG platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.0",
  "pytest>=8.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
